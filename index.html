<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape from the Solid Labyrinth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d1a; color: #ccc; font-family: monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    #app {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      width: 100%;
      max-width: 1460px;
    }

    /* LEFT PANEL */
    #panel-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 160px;
      flex-shrink: 0;
    }

    #player-portrait-box {
      width: 160px;
      height: 280px;
      background: #1a1a2e;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 12px;
      position: relative;
      overflow: hidden;
    }
    #player-portrait-box img { width: 100%; height: 100%; object-fit: cover; }
    #player-portrait-label {
      position: absolute; bottom: 4px; left: 0; right: 0;
      text-align: center; font-size: 11px; color: #888;
    }

    #stats-box {
      background: #1a1a2e;
      border: 1px solid #333;
      padding: 8px;
      font-size: 12px;
      line-height: 1.8;
    }
    #stats-box .label { color: #666; }
    #stats-box .value { color: #eee; }

    #petrif-bar-bg {
      width: 100%; height: 12px;
      background: #222; border: 1px solid #444; margin: 4px 0;
    }
    #petrif-bar-fill {
      height: 100%; background: #8844aa; width: 0%;
      transition: width 0.2s, background 0.3s;
    }
    #petrif-label { font-size: 11px; color: #aa88cc; font-style: italic; }

    #inventory-box {
      background: #1a1a2e;
      border: 1px solid #333;
      padding: 8px;
      font-size: 12px;
    }
    #inventory-box .inv-title { color: #666; margin-bottom: 4px; }
    #inventory-list { min-height: 20px; }
    .inv-item { color: #ddcc88; cursor: pointer; padding: 2px 0; }
    .inv-item:hover { color: #ffee99; }

    #companion-box {
      background: #1a1a2e;
      border: 1px solid #334;
      padding: 8px;
      font-size: 12px;
      display: none;
    }
    #companion-box.active { display: block; border-color: #6655aa; }
    #companion-name { color: #aa99ee; font-weight: bold; }
    #companion-status { color: #8888aa; font-size: 11px; }

    /* GAME CANVAS AREA */
    #game-container {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    #game canvas { display: block; }

    /* RIGHT PANEL */
    #panel-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 220px;
      flex-shrink: 0;
    }

    #statue-panel-box {
      background: #1a1a2e;
      border: 1px solid #333;
      padding: 10px;
      display: none;
      font-size: 12px;
    }
    #statue-panel-box.visible { display: block; border-color: #6644aa; }
    #statue-portrait-box {
      width: 100%; height: 200px;
      background: #111133;
      border: 1px solid #333;
      display: flex; align-items: center; justify-content: center;
      color: #444; font-size: 11px; margin-bottom: 8px;
    }
    #statue-portrait-box img { width: 100%; height: 100%; object-fit: cover; }
    #statue-name { font-size: 15px; color: #eeeeff; font-weight: bold; margin-bottom: 2px; }
    #statue-meta { color: #8888aa; font-size: 11px; margin-bottom: 8px; }
    .inspection-line { margin-bottom: 6px; }
    .inspection-label { color: #8888cc; font-style: italic; }
    .inspection-text { color: #ccccdd; }
    #statue-close-hint { color: #555; font-size: 11px; margin-top: 8px; text-align: center; }

    #interaction-menu-box {
      background: #1a1a2e;
      border: 1px solid #6644aa;
      padding: 10px;
      font-size: 13px;
    }
    #menu-header {
      color: #aaaaee;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .menu-option {
      padding: 6px 8px;
      color: #8888aa;
      cursor: pointer;
      border-radius: 3px;
      margin-bottom: 3px;
    }
    .menu-option.selected {
      background: #2a2a4e;
      color: #eeeeff;
      border-left: 3px solid #8866cc;
    }
    .menu-option:hover { background: #1e1e3a; }
    .menu-hint {
      color: #444;
      font-size: 11px;
      margin-top: 8px;
    }

    #message-log-box {
      background: #1a1a2e;
      border: 1px solid #333;
      padding: 8px;
      font-size: 12px;
      flex: 1;
    }
    #message-log-title { color: #555; margin-bottom: 4px; font-size: 11px; }
    #message-list { }
    .msg { color: #aaa; padding: 2px 0; border-bottom: 1px solid #1e1e33; line-height: 1.4; }
    .msg.recent { color: #ddd; }
    .msg.danger { color: #cc6666; }
    .msg.good { color: #66cc88; }

    #controls-hint {
      background: #111;
      border: 1px solid #222;
      padding: 6px 8px;
      font-size: 11px;
      color: #555;
      text-align: center;
    }

    /* MOBILE CONTROLS */
    #mobile-controls {
      display: none;
      padding: 8px;
      gap: 16px;
      justify-content: center;
      align-items: center;
      width: 100%;
      background: #0d0d1a;
      border-top: 1px solid #222;
    }
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 2px;
    }
    .dpad-btn {
      background: #1a1a2e;
      border: 1px solid #333;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .dpad-btn:active { background: #2a2a4e; color: #fff; }
    .dpad-center { background: #111; border-color: #222; cursor: default; }

    #action-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .action-btn {
      background: #1a1a2e;
      border: 1px solid #445;
      color: #99aacc;
      font-size: 13px;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-family: monospace;
      touch-action: manipulation;
    }
    .action-btn:active { background: #2a2a4e; }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      #app { flex-direction: column; align-items: center; }
      #panel-left { flex-direction: row; width: 100%; }
      #player-portrait-box { width: 100px; height: 160px; flex-shrink: 0; }
      #panel-right { width: 100%; }
      #mobile-controls { display: flex; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- LEFT PANEL: player portrait + stats -->
    <div id="panel-left">
      <div id="player-portrait-box">
        <span>[portrait]</span>
        <div id="player-portrait-label">— adventurer —</div>
      </div>
      <div id="stats-box">
        <div><span class="label">Floor: </span><span class="value" id="stat-floor">—</span></div>
        <div><span class="label">Turns: </span><span class="value" id="stat-turns">0</span></div>
        <div><span class="label">Petrification</span></div>
        <div id="petrif-bar-bg"><div id="petrif-bar-fill"></div></div>
        <div id="petrif-label">Normal</div>
        <div><span class="label">Stage: </span><span class="value" id="stat-stage">—</span></div>
      </div>
      <div id="inventory-box">
        <div class="inv-title">Inventory</div>
        <div id="inventory-list"><span style="color:#444">empty</span></div>
      </div>
      <div id="companion-box">
        <div id="companion-name">—</div>
        <div id="companion-status">following</div>
      </div>
    </div>

    <!-- CENTRE: Phaser canvas -->
    <div id="game-container">
      <div id="game"></div>
    </div>

    <!-- RIGHT PANEL: interaction menu + statue inspect + message log -->
    <div id="panel-right">
      <div id="interaction-menu-box" style="display:none">
        <div id="menu-header"></div>
        <div id="menu-options-list"></div>
        <div class="menu-hint">↑↓ select · Enter/Z confirm · Esc/X cancel</div>
      </div>
      <div id="statue-panel-box">
        <div id="statue-portrait-box"><span>[portrait]</span></div>
        <div id="statue-name">—</div>
        <div id="statue-meta">—</div>
        <div id="inspection-lines"></div>
        <div id="statue-close-hint">Press any key or tap to close</div>
      </div>
      <div id="message-log-box">
        <div id="message-log-title">— log —</div>
        <div id="message-list"></div>
      </div>
      <div id="controls-hint">Arrow/WASD move · Enter/Z interact · Esc cancel</div>
    </div>
  </div>

  <!-- Mobile controls (shown on narrow screens) -->
  <div id="mobile-controls">
    <div id="dpad">
      <div></div>
      <button class="dpad-btn" id="btn-n">▲</button>
      <div></div>
      <button class="dpad-btn" id="btn-w">◀</button>
      <div class="dpad-center"></div>
      <button class="dpad-btn" id="btn-e">▶</button>
      <div></div>
      <button class="dpad-btn" id="btn-s">▼</button>
      <div></div>
    </div>
    <div id="action-btns">
      <button class="action-btn" id="btn-confirm" style="background:#2a1a4e;border-color:#6644aa;color:#ccaaff">✓ Interact</button>
      <button class="action-btn" id="btn-cancel">✕ Cancel</button>
      <button class="action-btn" id="btn-inspect">I Inspect</button>
      <button class="action-btn" id="btn-use">U Use Oil</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
